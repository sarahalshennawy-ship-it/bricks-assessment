<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bricks &co — Content Plan Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{background:#f4f2fa;min-height:100vh}
#app{max-width:600px;margin:0 auto;padding:0 0 40px}
.hdr{background:#1a1a1a;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 0 0}
.hb{font-size:16px;font-weight:600;color:#fff}
.hs{font-size:10px;color:#764ba2;letter-spacing:1px;margin-top:1px}
.hbtn{background:transparent;border:0.5px solid rgba(255,255,255,0.2);color:#aaa;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px}
.body{padding:22px 16px}
.pr{display:flex;justify-content:space-between;margin-bottom:5px}
.pl{font-size:12px;font-weight:600;color:#764ba2}
.pp{font-size:12px;color:#888}
.pbar{height:3px;background:#e2e0ea;border-radius:3px;overflow:hidden;margin-bottom:20px}
.pfill{height:100%;background:#764ba2;border-radius:3px;transition:width 0.3s}
.qt{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:4px;line-height:1.3}
.qh{font-size:12px;color:#888;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:4px}
.gcol{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.ob{padding:11px 12px;border-radius:8px;border:1.5px solid #e2e0ea;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;text-align:left;line-height:1.3;transition:all 0.12s;width:100%}
.ob.sel{border-color:#764ba2;background:#F1ECFA;color:#764ba2;font-weight:600}
.ob:active{transform:scale(0.98)}
.lo{padding:13px 15px;border-radius:8px;border:1.5px solid #e2e0ea;background:#fff;cursor:pointer;text-align:left;transition:all 0.12s;width:100%;margin-bottom:7px;display:block}
.lo.sel{border-color:#764ba2;background:#F1ECFA}
.lo-t{font-size:14px;font-weight:600;color:#1a1a1a}
.lo.sel .lo-t,.lo.sel .lo-s{color:#764ba2}
.lo-s{font-size:11px;color:#888;margin-top:2px}
.dta{width:100%;min-height:110px;padding:11px;border-radius:8px;border:1.5px solid #e2e0ea;font-size:13px;line-height:1.6;color:#1a1a1a;background:#fff;resize:vertical;outline:none}
.dta:focus{border-color:#764ba2}
.cc{font-size:11px;color:#888;margin-top:4px}
.nav{display:flex;justify-content:space-between;margin-top:20px;align-items:center}
.btnb{padding:9px 16px;border-radius:8px;border:1.5px solid #e2e0ea;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer}
.btnn{padding:9px 18px;border-radius:8px;border:none;background:#764ba2;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btnn:disabled,.btng:disabled{opacity:0.35;cursor:not-allowed}
.btng{padding:10px 18px;border-radius:8px;border:none;background:#764ba2;color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp 0.7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.selc{font-size:11px;color:#667eea;margin-top:6px}
.errbox{margin-top:10px;padding:10px 12px;background:#FFF0EE;border:1px solid #ff4757;border-radius:8px;color:#ff4757;font-size:12px}
.gprog{background:#f1ecfa;border-radius:8px;padding:12px 14px;margin-top:12px}
.gptext{font-size:12px;color:#666;margin-bottom:7px;text-align:center}
.gpbar{height:5px;background:#ddd;border-radius:5px;overflow:hidden}
.gpfill{height:100%;background:#764ba2;border-radius:5px;transition:width 0.4s}
.lp{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.lpc{display:flex;gap:12px;justify-content:center;margin-top:24px}
.lpcbtn{flex:1;max-width:160px;padding:18px 12px;border-radius:12px;border:1.5px solid #e2e0ea;background:#fff;cursor:pointer;text-align:center;transition:all 0.15s}
.lpcbtn:hover{border-color:#764ba2;background:#F1ECFA}
.lpcbtn-m{font-size:19px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.lpcbtn-s{font-size:11px;color:#888}
.phdr{background:#1a1a1a;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.pbody{padding:14px}
.sumcard{background:#1a1a1a;border-radius:10px;padding:16px;margin-bottom:12px}
.sumt{font-size:16px;font-weight:600;color:#fff;margin-bottom:6px}
.sums{font-size:13px;color:#ccc;line-height:1.6;margin-bottom:10px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.wklbl{padding:6px 12px;background:#1a1a1a;border-radius:8px 8px 0 0;font-size:11px;font-weight:600;color:#ffd700;letter-spacing:0.5px}
.wkblk{background:#f1ecfa;border-radius:0 0 8px 8px;padding:7px 7px 2px;margin-bottom:10px}
.dcard{background:#fff;border:1px solid #e2e0ea;border-radius:8px;padding:12px 14px;margin-bottom:6px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dnum{font-size:12px;font-weight:600;min-width:42px}
.dpill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.cpbtn{padding:3px 9px;border-radius:6px;border:1px solid #764ba2;background:transparent;color:#764ba2;font-size:10px;cursor:pointer;white-space:nowrap}
.cpbtn.ok{background:#667eea;border-color:#667eea;color:#fff}
.flbl{font-size:10px;font-weight:600;letter-spacing:0.4px;margin-bottom:2px}
.fval{font-size:13px;color:#1a1a1a;line-height:1.5}
.fhook{font-size:13px;font-weight:600;color:#1a1a1a;line-height:1.5}
.fdiv{border:none;border-top:1px solid #ece7f5;margin:6px 0}
.ctabox{background:#764ba2;border-radius:10px;padding:16px;margin-top:4px}
.ctat{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}
.ctas{font-size:12px;color:rgba(255,255,255,0.85);line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<script>
var DATA={bizTypes:{en:["Medical Aesthetic / Clinic","Salon / Spa / Beauty Center","Gym / Fitness Studio","Restaurant / Café","E-commerce / Products","Abaya / Fashion Brand","Perfume / Luxury Products","Agency / Consulting","Retail Shop","Personal Brand / Creator","Coach / Trainer / Educator","Other Service Business"],ar:["عيادة تجميل طبية","صالون / سبا / مركز تجميل","صالة رياضية / استوديو لياقة","مطعم / كافيه","تجارة إلكترونية / منتجات","براند عبايات / أزياء","عطور / منتجات فاخرة","وكالة / استشارات","متجر بيع بالتجزئة","براند شخصي / كريتور","مدرب / معلم / مستشار","خدمة أخرى"]},goals:{en:["Get more clients / customers","Increase brand awareness","Build authority and trust","Launch a new product or service","Reactivate old customers","Grow social media following"],ar:["جذب عملاء جدد","زيادة الوعي بالبراند","بناء السلطة والمصداقية","إطلاق منتج أو خدمة جديدة","إعادة تنشيط العملاء القدامى","تنمية المتابعين على السوشيال ميديا"]},platforms:{en:["Instagram","TikTok","Snapchat","LinkedIn","X (Twitter)","YouTube Shorts"],ar:["إنستغرام","تيك توك","سناب شات","لينكدإن","تويتر X","يوتيوب شورتس"]},audience:{en:["Women 18–24","Women 25–34","Women 35–44","Women 45–55","Men 18–24","Men 25–34","Men 35–44","Men 45–55","Entrepreneurs","Students / Graduates","Families","High-income professionals","Health-conscious","Fashion & beauty fans","Gulf Arabic audience","Expats in Gulf"],ar:["نساء 18–24","نساء 25–34","نساء 35–44","نساء 45–55","رجال 18–24","رجال 25–34","رجال 35–44","رجال 45–55","رواد أعمال","طلاب وخريجون","أسر ومتزوجون","محترفون ذوو دخل مرتفع","مهتمون بالصحة","عشاق الموضة والجمال","جمهور خليجي عربي","مقيمون في الخليج"]},contentLangs:{en:[{v:"Gulf Arabic",l:"Gulf Arabic",s:"Natural Khaleeji — خليجي طبيعي"},{v:"Neutral Arabic",l:"Arabic — Neutral",s:"Clear Arabic for all Arab countries"},{v:"English",l:"English",s:"International / Gulf English"},{v:"Arabic+English",l:"Arabic + English",s:"Arabic captions with English terms"}],ar:[{v:"Gulf Arabic",l:"عربي خليجي",s:"نبرة خليجية طبيعية"},{v:"Neutral Arabic",l:"عربي بدون لهجة",s:"عربي واضح لجميع الجنسيات"},{v:"English",l:"إنجليزي",s:"مناسب للجمهور الدولي"},{v:"Arabic+English",l:"عربي + إنجليزي",s:"كابشنات عربية مع مصطلحات إنجليزية"}]},questions:{en:[{q:"What type of business do you run?",h:"Pick the one that matches best"},{q:"What is your main goal right now?",h:"Pick one — the most urgent"},{q:"Where do you post your content?",h:"Select all that apply"},{q:"Who is your target audience?",h:"Select all that apply"},{q:"What language should your content be in?",h:"Hooks and captions will be in this language"},{q:"Describe your business briefly",h:"What do you sell? What makes you different? What city?"}],ar:[{q:"ما نوع بزنسك؟",h:"اختر الأقرب لطبيعة عملك"},{q:"ما هو هدفك الرئيسي الآن؟",h:"اختر واحد — الأهم والأكثر إلحاحاً"},{q:"وين تنشر محتواك؟",h:"اختر كل ما ينطبق"},{q:"من هو جمهورك المستهدف؟",h:"اختر كل ما ينطبق"},{q:"بأي لغة تريد توليد المحتوى؟",h:"الهوكات والكابشنات ستُكتب بهذه اللغة"},{q:"اوصف بزنسك باختصار",h:"إيش تبيع؟ إيش يميزك؟ في أي مدينة؟"}]},pillars:{en:["Authority","Social Proof","Behind Scenes","Offer","Entertainment"],ar:["سلطة","دليل اجتماعي","كواليس","عرض","ترفيه"]}};
var PC=["#764ba2","#667eea","#ffd700","#4a5fc7","#9a6fd1"];
var FMTS=["Reel","Carousel","Story","Reel","Post"];
var S={lang:null,step:0,biz:"",goal:"",platforms:[],audience:[],cl:"",desc:"",plan:null,loading:false,genPct:0,genMsg:"",error:""};
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $id(id){return document.getElementById(id);}
function isAR(){return S.lang==="ar";}
function isValid(){if(S.step===0)return S.biz!=="";if(S.step===1)return S.goal!=="";if(S.step===2)return S.platforms.length>0;if(S.step===3)return S.audience.length>0;if(S.step===4)return S.cl!=="";if(S.step===5)return true;return false;}
function render(){var app=$id("app");app.setAttribute("dir",isAR()?"rtl":"ltr");if(!S.lang){renderLP(app);return;}if(S.plan){renderPlan(app);return;}renderQuiz(app);}
function renderLP(app){app.innerHTML='<div class="lp"><div style="font-size:11px;color:#764ba2;font-weight:600;letter-spacing:1px;margin-bottom:5px">Bricks &amp;co</div><div style="font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:5px">Content Plan Generator</div><div style="font-size:13px;color:#888;margin-bottom:4px">Answer 6 questions — get your full 30-day content plan</div><div style="font-size:13px;color:#888">Choose your language / اختر لغتك</div><div class="lpc"><button class="lpcbtn" id="btnEN"><div class="lpcbtn-m">English</div><div class="lpcbtn-s">Left to right</div></button><button class="lpcbtn" id="btnAR"><div class="lpcbtn-m">العربية</div><div class="lpcbtn-s">من اليمين لليسار</div></button></div></div>';$id("btnEN").addEventListener("click",function(){S.lang="en";render();});$id("btnAR").addEventListener("click",function(){S.lang="ar";render();});}
function renderQuiz(app){var ar=isAR();var q=DATA.questions[S.lang][S.step];var pct=Math.round((S.step/6)*100);var ok=isValid();var isLast=S.step===5;var genTxt=ar?"ولّد خطة المحتوى":"Generate 30-Day Plan";app.innerHTML='<div class="hdr"><div><div class="hb">Bricks &amp;co</div><div class="hs">'+(ar?"مولّد خطة المحتوى":"CONTENT PLAN GENERATOR")+'</div></div><button class="hbtn" id="chgBtn">'+(ar?"تغيير اللغة":"Change language")+'</button></div><div class="body"><div class="pr"><span class="pl">'+(ar?("الخطوة "+(S.step+1)+" من 6"):("Step "+(S.step+1)+" of 6"))+'</span><span class="pp">'+pct+'%</span></div><div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div><div class="qt">'+esc(q.q)+'</div><div class="qh">'+esc(q.h)+'</div><div id="sc"></div><div class="nav">'+(S.step>0?'<button class="btnb" id="backBtn">'+(ar?"السابق":"Back")+'</button>':'<span></span>')+(!isLast?'<button class="btnn" id="nextBtn" '+(ok?'':'disabled')+'>'+(ar?"التالي ←":"Next →")+'</button>':'<button class="btng" id="genBtn" '+((ok&&!S.loading)?'':'disabled')+'>'+(S.loading?'<span class="spin"></span><span>'+esc(S.genMsg)+'</span>':'<span>'+genTxt+'</span>')+'</button>')+'</div>'+(S.loading?'<div class="gprog"><div class="gptext">'+esc(S.genMsg)+'</div><div class="gpbar"><div class="gpfill" style="width:'+S.genPct+'%"></div></div></div>':'')+(S.error?'<div class="errbox">'+esc(S.error)+'</div>':'')+'</div>';
var chg=$id("chgBtn");if(chg)chg.addEventListener("click",function(){S.lang=null;render();});
var back=$id("backBtn");if(back)back.addEventListener("click",function(){S.step--;render();});
var next=$id("nextBtn");if(next)next.addEventListener("click",function(){if(isValid()){S.step++;render();}});
var gen=$id("genBtn");if(gen)gen.addEventListener("click",function(){doGenerate();});
buildStep();}
function buildStep(){var sc=$id("sc");if(!sc)return;var ar=isAR();var s=S.step;var html="";
if(s===0){html='<div class="g2">';DATA.bizTypes[S.lang].forEach(function(b,i){html+='<button class="ob'+(S.biz===b?" sel":"")+'" data-idx="'+i+'" data-type="biz">'+esc(b)+'</button>';});html+='</div>';}
else if(s===1){html='<div class="gcol">';DATA.goals[S.lang].forEach(function(g,i){html+='<button class="ob'+(S.goal===g?" sel":"")+'" data-idx="'+i+'" data-type="goal">'+esc(g)+'</button>';});html+='</div>';}
else if(s===2){html='<div class="g3">';DATA.platforms[S.lang].forEach(function(p,i){html+='<button class="ob'+(S.platforms.indexOf(p)>=0?" sel":"")+'" data-idx="'+i+'" data-type="plt">'+esc(p)+'</button>';});html+='</div>';if(S.platforms.length>0)html+='<div class="selc">'+S.platforms.length+' '+(ar?"محددة":"selected")+'</div>';}
else if(s===3){html='<div class="g2">';DATA.audience[S.lang].forEach(function(a,i){var sel=S.audience.indexOf(a)>=0;html+='<button class="ob'+(sel?" sel":"")+'" data-idx="'+i+'" data-type="aud">'+(sel?"✓ ":"")+esc(a)+'</button>';});html+='</div>';if(S.audience.length>0)html+='<div class="selc">'+S.audience.length+' '+(ar?"فئة":"selected")+'</div>';}
else if(s===4){DATA.contentLangs[S.lang].forEach(function(c,i){html+='<button class="lo'+(S.cl===c.v?" sel":"")+'" data-idx="'+i+'" data-type="cl"><div class="lo-t">'+esc(c.l)+'</div><div class="lo-s">'+esc(c.s)+'</div></button>';});}
else if(s===5){var ph=ar?"مثال: عيادة تجميل في دبي. نستهدف النساء 25–45.":"Example: Aesthetic clinic in Dubai targeting women 25–45.";html='<textarea class="dta" id="dta" placeholder="'+esc(ph)+'">'+esc(S.desc)+'</textarea><div class="cc" id="cc">'+S.desc.length+' '+(ar?"حرف":"chars")+'</div>';}
sc.innerHTML=html;
sc.addEventListener("click",function(e){var btn=e.target.closest("button");if(!btn)return;var type=btn.getAttribute("data-type");var idx=parseInt(btn.getAttribute("data-idx"));if(isNaN(idx))return;if(type==="biz"){S.biz=DATA.bizTypes[S.lang][idx];render();}else if(type==="goal"){S.goal=DATA.goals[S.lang][idx];render();}else if(type==="plt"){var p=DATA.platforms[S.lang][idx];var pi=S.platforms.indexOf(p);if(pi>=0)S.platforms.splice(pi,1);else S.platforms.push(p);render();}else if(type==="aud"){var a=DATA.audience[S.lang][idx];var ai=S.audience.indexOf(a);if(ai>=0)S.audience.splice(ai,1);else S.audience.push(a);render();}else if(type==="cl"){S.cl=DATA.contentLangs[S.lang][idx].v;render();}});
var ta=$id("dta");if(ta){ta.style.direction=ar?"rtl":"ltr";ta.style.textAlign=ar?"right":"left";ta.addEventListener("input",function(){S.desc=this.value;var cc=$id("cc");if(cc)cc.textContent=this.value.length+(ar?" حرف":" chars");});}}
function getLangInstr(){if(S.cl==="Gulf Arabic")return"Gulf Arabic خليجي — casual, warm, exactly how Gulf people talk.";if(S.cl==="Neutral Arabic")return"Neutral Arabic — clear modern Arabic any Arab understands, no dialect.";if(S.cl==="Arabic+English")return"Neutral Arabic with natural English keywords.";return"Natural English for the Gulf/MENA market.";}
function parsePlainText(text,startDay){var days=[];var blocks=text.split(/---+/);for(var bi=0;bi<blocks.length;bi++){var block=blocks[bi].trim();if(!block)continue;var lines=block.split(/\n/);var obj={day:startDay+days.length,format:"Reel",hook:"",caption:"",cta:""};for(var li=0;li<lines.length;li++){var line=lines[li].trim();var sep=line.indexOf(":");if(sep<0)continue;var key=line.slice(0,sep).trim().toUpperCase();var val=line.slice(sep+1).trim();if(key==="DAY"){var n=parseInt(val);if(!isNaN(n))obj.day=n;}else if(key==="FORMAT")obj.format=val;else if(key==="HOOK")obj.hook=val;else if(key==="CAPTION")obj.caption=val;else if(key==="CTA")obj.cta=val;}if(obj.hook||obj.caption)days.push(obj);}if(days.length===0){for(var i=0;i<5;i++){var d=startDay+i;days.push({day:d,format:FMTS[(d-1)%5],hook:"Content for day "+d,caption:"Post for your "+S.biz,cta:"Follow for more"});}}return days;}
function makePrompt(startDay){var pm=["Authority/Education","Social Proof","Behind the Scenes","Offer/CTA","Entertainment"];var dl=[];for(var i=0;i<5;i++){var d=startDay+i;dl.push("Day "+d+" = "+pm[(d-1)%5]+", Format = "+FMTS[(d-1)%5]);}return"Social media strategist for Gulf/MENA.\nLanguage: "+getLangInstr()+"\nBusiness: "+S.biz+" | Goal: "+S.goal+" | Audience: "+S.audience.slice(0,3).join(", ")+"\nInfo: "+S.desc.slice(0,120)+"\n\nWrite content for:\n"+dl.join("\n")+"\n\nUse EXACTLY this format:\nDAY:[number]\nFORMAT:[Reel or Carousel or Story or Post]\nHOOK:[punchy, max 12 words, specific to this business]\nCAPTION:[content idea, max 20 words]\nCTA:[action, max 8 words]\n---\n\nAll 5 days. No JSON. No markdown. Nothing else.";}
async function callAPI(prompt,tok){var res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:tok||900,messages:[{role:"user",content:prompt}]})});if(!res.ok){var e=await res.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||("HTTP "+res.status));}var d=await res.json();return(d.content&&d.content[0]&&d.content[0].text)||"";}
async function doGenerate(){if(S.loading)return;S.loading=true;S.error="";S.genPct=0;var ar=isAR();var allDays=[];var starts=[1,6,11,16,21,26];try{for(var ci=0;ci<starts.length;ci++){var start=starts[ci];S.genMsg=ar?("جاري توليد الأيام "+start+"–"+(start+4)+"..."):("Generating days "+start+"–"+(start+4)+" of 30...");S.genPct=Math.round((ci/7)*85);render();var raw=await callAPI(makePrompt(start),900);allDays=allDays.concat(parsePlainText(raw,start));}S.genMsg=ar?"جاري الإنهاء...":"Finishing...";S.genPct=92;render();var sr=await callAPI("For this "+S.biz+" (goal: "+S.goal+"): 2-sentence content strategy in "+S.cl+" language.\n3 short themes.\nFormat:\nSUMMARY:[text]\nTHEME1:[text]\nTHEME2:[text]\nTHEME3:[text]",300);var summary=ar?"خطتك جاهزة.":"Your 30-day plan is ready.";var themes=ar?["سلطة","تفاعل","تحويل"]:["Authority","Engagement","Conversion"];sr.split("\n").forEach(function(line){var sep=line.indexOf(":");if(sep<0)return;var k=line.slice(0,sep).trim().toUpperCase();var v=line.slice(sep+1).trim();if(k==="SUMMARY")summary=v;else if(k==="THEME1")themes[0]=v;else if(k==="THEME2")themes[1]=v;else if(k==="THEME3")themes[2]=v;});S.genPct=100;render();await new Promise(function(res){setTimeout(res,200);});allDays.sort(function(a,b){return a.day-b.day;});S.plan={summary:summary,keyThemes:themes,days:allDays};S.loading=false;render();}catch(err){S.loading=false;S.error=ar?("خطأ: "+err.message+". حاول مرة أخرى."):("Error: "+err.message+". Please try again.");render();}}
function renderPlan(app){var ar=isAR();var p=S.plan;var isRTL=ar;var dL=ar?"اليوم":"Day";var hL=ar?"الهوك":"HOOK";var iL=ar?"الفكرة":"IDEA";var cL=ar?"الـ CTA":"CTA";var cpL=ar?"نسخ":"Copy";var wL=ar?"الأسبوع":"WEEK";var wHTML="";for(var w=1;w<=4;w++){var wd=(p.days||[]).filter(function(d){return d.day>=(w-1)*7+1&&d.day<=w*7;});var dh=wd.map(function(d){var pi=(d.day-1)%5;var pc=PC[pi];var lb=isRTL?("border-right:3px solid "+pc+";border-left:none"):("border-left:3px solid "+pc+";border-right:none");return'<div class="dcard" style="'+lb+'"><div class="dtop"><div class="dmeta"><span class="dnum" style="color:'+pc+'">'+dL+' '+d.day+'</span><span class="dpill" style="background:'+pc+'22;color:'+pc+'">'+DATA.pillars[S.lang][pi]+'</span>'+(d.format?'<span class="dpill" style="background:#667eea22;color:#667eea">'+esc(d.format)+'</span>':'')+' </div><button class="cpbtn" data-day="'+d.day+'">'+cpL+'</button></div><div class="flbl" style="color:'+pc+'">'+hL+'</div><div class="fhook" style="text-align:'+(isRTL?"right":"left")+'">'+esc(d.hook)+'</div><div class="fdiv"></div><div class="flbl" style="color:#764ba2">'+iL+'</div><div class="fval" style="text-align:'+(isRTL?"right":"left")+'">'+esc(d.caption)+'</div><div class="fdiv"></div><div class="flbl" style="color:#667eea">'+cL+'</div><div class="fval" style="text-align:'+(isRTL?"right":"left")+'">'+esc(d.cta)+'</div></div>';}).join("");wHTML+='<div class="wklbl">'+wL+' '+w+' — '+(ar?("اليوم "+((w-1)*7+1)+"–"+(w*7)):("Days "+((w-1)*7+1)+"–"+(w*7)))+'</div><div class="wkblk">'+dh+'</div>';}var tc=["#764ba2","#ffd700","#667eea"];var tpills=(p.keyThemes||[]).map(function(t,i){return'<span class="pill" style="background:'+tc[i%3]+'33;color:'+tc[i%3]+'">'+esc(t)+'</span>';}).join("");app.innerHTML='<div><div class="phdr"><div><div class="hb">Bricks &amp;co</div><div class="hs">'+(ar?"خطة المحتوى":"30-DAY CONTENT PLAN")+'</div></div><button class="hbtn" id="npBtn">'+(ar?"خطة جديدة":"New plan")+'</button></div><div class="pbody"><div class="sumcard"><div class="sumt">'+(ar?"خطة المحتوى لـ 30 يوم":"Your 30-Day Content Plan")+'</div><div class="sums" style="text-align:'+(isRTL?"right":"left")+'">'+esc(p.summary)+'</div><div class="pills">'+tpills+'</div></div>'+wHTML+'<div class="ctabox"><div class="ctat">🚀 '+(ar?"احجز جلسة استشارة 1:1 — 99$":"Book your 1:1 Consultation — $99 (standard $189)")+'</div><div class="ctas">'+(ar?"شراء الـ Toolkit بـ 39$ يؤهلك للجلسة. 30 دقيقة، مراجعة مباشرة لاستراتيجيتك.":"Your $39 toolkit purchase makes you eligible. 30-minute live strategy audit.")+'</div></div></div></div>';
var np=$id("npBtn");if(np)np.addEventListener("click",function(){S={lang:S.lang,step:0,biz:"",goal:"",platforms:[],audience:[],cl:"",desc:"",plan:null,loading:false,genPct:0,genMsg:"",error:""};render();});
app.addEventListener("click",function(e){var btn=e.target.closest(".cpbtn");if(!btn)return;var day=parseInt(btn.getAttribute("data-day"));var d=(p.days||[]).find(function(x){return x.day===day;});if(!d)return;var txt=(d.hook||"")+"\n\n"+(d.caption||"")+"\n\n"+(d.cta||"");navigator.clipboard.writeText(txt).then(function(){btn.textContent="✓";btn.classList.add("ok");setTimeout(function(){btn.textContent=ar?"نسخ":"Copy";btn.classList.remove("ok");},2000);}).catch(function(){});});}
render();
</script>
