*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#FBE6EF 0,transparent 420px) no-repeat,var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px}
.w{max-width:720px;margin:0 auto;padding:16px}

.btn{display:block;width:100%;background:var(--sun);color:var(--deep);border:0;border-radius:12px;padding:15px 16px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}
.btn.dark{background:var(--plum);color:#fff}
h2{font-size:22px;margin:30px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:18px}.tag{display:inline-block;background:var(--soft);color:var(--rasp);font-weight:800;font-size:11px;letter-spacing:.05em;padding:3px 9px;border-radius:6px;margin-bottom:6px}
.card ul{margin:8px 0 0;padding-inline-start:20px}.card li{margin:4px 0}.muted{color:var(--muted);font-size:14px}
.mock{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#D14B7F,var(--plum))}
.mrow{display:flex;justify-content:space-between}.ok{color:#2E7D62;font-weight:700}.bad{color:#C2413B;font-weight:700}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.val{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.val s{color:var(--muted)}
.bar-cta{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:9}
.bar-cta .p{font-weight:800;font-size:20px;white-space:nowrap}.bar-cta .btn{padding:12px}
