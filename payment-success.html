    <p id="body">We're emailing your access codes and files now. It usually arrives within a minute or two.</p>
    <p id="emailShown"></p>
    <p class="note" id="note">Didn't get it? Check your spam folder, or email <a href="mailto:info@bricksmedia.org">info@bricksmedia.org</a> and we'll resend it right away.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var tier = params.get('tier') || '';
    var free = params.get('free') === 'true';
    var ar = (sessionStorage.getItem('lang') || sessionStorage.getItem('LANG') || '') === 'ar' || document.cookie.indexOf('lang=ar') > -1;
    var NAMES = {
      en: { entrepreneur: 'Entrepreneur Package', starter: 'Starter Package', content: 'AI Content Plan Generator', planner: 'UAE Business Launch Planner', toolkit: 'Finance & Sales Toolkit', kit: 'Gulf Founder Kit', upgrade: 'Consultation Upgrade' },
      ar: { entrepreneur: 'باقة رائد الأعمال', starter: 'باقة الانطلاق', content: 'مولِّد خطة المحتوى بالذكاء الاصطناعي', planner: 'مخطِّط إطلاق الأعمال في الإمارات', toolkit: 'أدوات المالية والمبيعات', kit: 'حقيبة مؤسس الأعمال في الخليج', upgrade: 'ترقية الاستشارة' }
    };
    ['starter','growth','pro'].forEach(function (k) { [1,3,6].forEach(function (m) {
      var nm = k.charAt(0).toUpperCase() + k.slice(1);
      NAMES.en['cv'+k+m] = 'CV Screener ' + nm + ' (' + m + (m > 1 ? ' months)' : ' month)');
      NAMES.ar['cv'+k+m] = 'فاحص السير الذاتية - باقة ' + nm + ' - ' + m + (m > 2 ? ' أشهر' : ' شهر');
    }); });
    var L = ar ? 'ar' : 'en';
    if (ar) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    var T = {
      en: { title: 'Payment received, thank you!', body: "We're emailing your access codes and files now. It usually arrives within a minute or two.",
            freeTitle: "You're all set, no charge!", freeBody: "Your code was applied, so this one is free. We're emailing your access codes and files now.",
            badge: 'FREE ACCESS', sent: 'Sent to: ',
            note: 'Didn\'t get it? Check your spam folder, or email <a href="mailto:info@bricksmedia.org">info@bricksmedia.org</a> and we\'ll resend it right away.' },
      ar: { title: 'تم استلام الدفع، شكراً لك!', body: 'نرسل الآن رموز الدخول والملفات إلى بريدك الإلكتروني، وتصل عادةً خلال دقيقة أو دقيقتين.',
            freeTitle: 'تم كل شيء، دون أي رسوم!', freeBody: 'تم تفعيل الكود، لذا فهذه الباقة مجانية. نرسل الآن رموز الدخول والملفات إلى بريدك الإلكتروني.',
            badge: 'وصول مجاني', sent: 'أُرسلت إلى: ',
            note: 'لم تصلك الرسالة؟ تحقّق من مجلد الرسائل غير المرغوب فيها، أو راسلنا على <a href="mailto:info@bricksmedia.org">info@bricksmedia.org</a> وسنعيد إرسالها فوراً.' }
    }[L];
    document.getElementById('product').textContent = NAMES[L][tier] || '';
    document.getElementById('title').textContent = free ? T.freeTitle : T.title;
    document.getElementById('body').textContent = free ? T.freeBody : T.body;
    document.getElementById('note').innerHTML = T.note;
    if (free) {
      var b = document.createElement('div'); b.className = 'badge'; b.textContent = T.badge;
      var card = document.getElementById('card'); card.insertBefore(b, document.getElementById('product'));
    }
    var storedEmail = sessionStorage.getItem('userEmail');
    if (storedEmail) document.getElementById('emailShown').textContent = T.sent + storedEmail;
  </script>
</body>
</html>
