<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bricks — Users Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
:root{--ink:#2C1F17;--terracotta:#ff6b35;--gold:#F6C74B;--olive:#85A655;--cream:#FDF8F4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:var(--cream);min-height:100vh;padding:24px}
#app{max-width:1400px;margin:0 auto}
h1{font-family:'Fraunces',serif;font-size:24px;color:var(--ink);margin-bottom:6px}
.sub{font-size:13px;color:#9a8a75;margin-bottom:24px}
.card{background:#fff;border:1px solid #ece1d7;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(44,31,23,0.05)}
label{display:block;font-size:11.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
input{padding:10px 12px;border-radius:8px;border:1.5px solid #e5dad0;font-size:13px;outline:none;width:100%;max-width:320px}
input:focus{border-color:var(--terracotta)}
button{padding:10px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--terracotta),var(--gold));color:#fff;font-weight:600;font-size:13px;cursor:pointer}
button.secondary{background:#fff;border:1.5px solid #e5dad0;color:var(--ink)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.stats{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #ece1d7;border-radius:10px;padding:14px 20px;min-width:140px}
.stat-num{font-size:26px;font-weight:800;color:var(--ink)}
.stat-lbl{font-size:11px;color:#9a8a75;text-transform:uppercase;letter-spacing:0.4px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.3px;color:#9a8a75;padding:8px 10px;border-bottom:2px solid #ece1d7;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f2ebe3;color:var(--ink);white-space:nowrap}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:700;white-space:nowrap}
.badge.free_only{background:#eee;color:#888}
.badge.purchased_blueprint{background:#fdeee4;color:var(--terracotta)}
.badge.purchased_consultation{background:#e8f2df;color:var(--olive)}
.badge.purchased_upgrade{background:#f0e8f7;color:#8a5fc4}
#gate{max-width:380px;margin:80px auto;text-align:center}
.tablewrap{overflow-x:auto}
.msg{font-size:12px;margin-top:10px;padding:8px 12px;border-radius:8px}
.msg.err{background:#fbe4e0;color:#a8402e}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY = "";
var ALL_USERS = [];

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtDate(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
function statusLabel(s){return {free_only:'Free only',purchased_blueprint:'Blueprint',purchased_consultation:'Consultation',purchased_upgrade:'Upgrade'}[s]||s;}

function renderGate(){
  document.getElementById('app').innerHTML =
    '<div id="gate"><h1>Bricks Users</h1><div class="sub">Enter your admin key to continue</div>' +
    '<div class="card"><label>Admin key</label><input type="password" id="keyInput" placeholder="Your ASSESSMENT_ADMIN_SECRET"><button style="width:100%;margin-top:12px" id="unlockBtn">Unlock</button><div id="gateMsg"></div></div></div>';
  document.getElementById('unlockBtn').onclick = function(){
    KEY = document.getElementById('keyInput').value.trim();
    if(!KEY){return;}
    loadUsers();
  };
}

function computeStats(users){
  var stats = { total: users.length, free_only: 0, purchased_blueprint: 0, purchased_consultation: 0, purchased_upgrade: 0 };
  users.forEach(function(u){ stats[u.status] = (stats[u.status]||0) + 1; });
  return stats;
}

function renderDashboard(users, msg){
  var stats = computeStats(users);
  var rows = users.map(function(u){
    var ia = u.introAnswers || {};
    return '<tr>' +
      '<td>'+esc(u.name)+'</td>' +
      '<td>'+esc(u.email)+'</td>' +
      '<td>'+esc(u.businessName)+'</td>' +
      '<td><span class="badge '+u.status+'">'+statusLabel(u.status)+'</span></td>' +
      '<td>'+esc(u.couponUsed||'—')+'</td>' +
      '<td>'+(u.amountPaidAED!=null?('AED '+u.amountPaidAED):'—')+'</td>' +
      '<td>'+esc(ia.businessType||'—')+'</td>' +
      '<td>'+esc(ia.industry||'—')+'</td>' +
      '<td>'+esc(ia.revenue||'—')+'</td>' +
      '<td>'+esc(ia.targetRevenue||'—')+'</td>' +
      '<td>'+esc(ia.timeframe||'—')+'</td>' +
      '<td>'+esc(ia.teamSize||'—')+'</td>' +
      '<td>'+(u.overallScore!=null?u.overallScore:'—')+'</td>' +
      '<td>'+fmtDate(u.firstSeenAt)+'</td>' +
      '<td>'+fmtDate(u.lastUpdatedAt)+'</td>' +
    '</tr>';
  }).join('');
  if(users.length===0) rows = '<tr><td colspan="15" style="text-align:center;color:#b0a190;padding:20px">No users tracked yet.</td></tr>';

  document.getElementById('app').innerHTML =
    '<h1>Bricks — Users Dashboard</h1><div class="sub">Everyone who has gone through the assessment, free or paid</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="stat-num">'+stats.total+'</div><div class="stat-lbl">Total tracked</div></div>' +
      '<div class="stat"><div class="stat-num">'+stats.free_only+'</div><div class="stat-lbl">Free only</div></div>' +
      '<div class="stat"><div class="stat-num">'+stats.purchased_blueprint+'</div><div class="stat-lbl">Blueprint</div></div>' +
      '<div class="stat"><div class="stat-num">'+stats.purchased_consultation+'</div><div class="stat-lbl">Consultation</div></div>' +
      '<div class="stat"><div class="stat-num">'+stats.purchased_upgrade+'</div><div class="stat-lbl">Upgrade</div></div>' +
    '</div>' +
    '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">' +
      '<label style="margin:0">All users ('+users.length+')</label>' +
      '<div style="display:flex;gap:8px"><button class="secondary" id="exportBtn">Export CSV</button><button class="secondary" id="refreshBtn">Refresh</button></div>' +
    '</div>' +
    '<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Business</th><th>Status</th><th>Coupon</th><th>Paid</th><th>Type</th><th>Industry</th><th>Revenue</th><th>Target Revenue</th><th>Timeframe</th><th>Team Size</th><th>Score</th><th>First Seen</th><th>Last Updated</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
    (msg?('<div class="msg '+msg.type+'">'+esc(msg.text)+'</div>'):'') +
    '</div>';

  document.getElementById('refreshBtn').onclick = loadUsers;
  document.getElementById('exportBtn').onclick = function(){ exportCSV(users); };
}

async function loadUsers(){
  try{
    var res = await fetch('/api/list-users', { headers: { 'x-admin-key': KEY } });
    if(res.status===401){renderGate();document.getElementById('gateMsg').innerHTML='<div class="msg err">Wrong key. Try again.</div>';return;}
    var data = await res.json();
    ALL_USERS = data.users||[];
    renderDashboard(ALL_USERS);
  }catch(err){
    document.getElementById('app').innerHTML = '<div class="card msg err">Could not load users: '+esc(err.message)+'</div>';
  }
}

function exportCSV(users){
  var headers = ['Name','Email','Phone','Business','Status','Coupon Used','Amount Paid (AED)','Business Type','Industry','Business Age','Current Revenue','Target Revenue','Timeframe','Team Size','Overall Score','First Seen','Last Updated','Purchased At'];
  var rows = users.map(function(u){
    var ia = u.introAnswers || {};
    return [u.name, u.email, u.phone, u.businessName, statusLabel(u.status), u.couponUsed||'', u.amountPaidAED!=null?u.amountPaidAED:'',
      ia.businessType||'', ia.industry||'', ia.businessAge||'', ia.revenue||'', ia.targetRevenue||'', ia.timeframe||'', ia.teamSize||'',
      u.overallScore!=null?u.overallScore:'', u.firstSeenAt||'', u.lastUpdatedAt||'', u.purchasedAt||''
    ].map(function(v){ v = String(v==null?'':v); return '"' + v.replace(/"/g,'""') + '"'; }).join(',');
  });
  var csv = headers.map(function(h){return '"'+h+'"';}).join(',') + '\n' + rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'bricks-users-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

renderGate();
</script>
</body>
</html>
